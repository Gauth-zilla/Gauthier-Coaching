else{if(pct>.3){msg="Ton poids monte alors que tu veux le maintenir. Retire 100 à 150 kcal par jour.";tone="wa"}else if(pct<-.3){msg="Ton poids baisse alors que tu veux le maintenir. Ajoute 100 à 150 kcal par jour.";tone="wa"}else msg="Ton poids est stable : continue."}
return{wk,pct,t,msg,tone,n}}
/* Course : VDOT de Jack Daniels (coût en oxygène et fraction de VO2max en fonction de la durée) */
const V2=v=>-4.6+.182258*v+.000104*v*v,PCT=t=>.8+.1894393*Math.exp(-.012778*t)+.2989558*Math.exp(-.1932605*t);
const vdotOf=(d,s)=>{const t=s/60;return V2(d/t)/PCT(t)},vAt=o=>(-.182258+Math.sqrt(.182258**2+4*.000104*(4.6+o)))/(2*.000104),pkm=v=>mm(60000/v);
const hms=s=>s>=3600?Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(R(s%60)).padStart(2,"0"):mm(s);
function predT(V,d){let lo=d/700*60,hi=d/90*60;for(let i=0;i<70;i++){const m=(lo+hi)/2;if(vdotOf(d,m)>V)lo=m;else hi=m}return(lo+hi)/2}
const paces=V=>[["Allure facile (footing, sorties longues)",pkm(vAt(V*.72))+" à "+pkm(vAt(V*.62))+" /km"],["Allure seuil (tempo)",pkm(vAt(V*.88))+" /km"],["Allure d’intervalles (4 à 5 min)",pkm(vAt(V*.98))+" /km"],["Allure de répétitions courtes (400 m)",pkm(vAt(V*1.05))+" /km, soit "+hms(R(400/vAt(V*1.05)*60))+" les 400 m"]];
const hrZ=age=>{const mx=R(208-.7*age);return{mx,z:[[50,60,"Zone 1 : récupération"],[60,70,"Zone 2 : endurance, tu peux parler"],[70,80,"Zone 3 : allure modérée"],[80,90,"Zone 4 : seuil, effort soutenu"],[90,100,"Zone 5 : très intense (intervalles)"]].map(([a,b,t])=>[t,R(mx*a/100),R(mx*b/100)])}};
const PLQ=[25,20,15,10,5,2.5,1.25];
function plates(tot,bar){let s=(tot-bar)/2;if(s<0)return null;const o=[];for(const q of PLQ){while(s>=q-1e-9){o.push(q);s-=q}}return{o,r:R(s*1000)/1000}}

const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dJours=d=>d?Math.round((new Date(today()+"T12:00:00")-new Date(d+"T12:00:00"))/864e5):null;
const dFr2=d=>d?String(d).slice(8,10)+"/"+String(d).slice(5,7)+"/"+String(d).slice(2,4):"—";

function info(c){const p=c.p;if(!p)return{c,ok:false};let P=null,m=null;try{P=gen(p,c.tests||[],c.lifts||{});m=calc(p,(c.body||[]).slice(-1)[0])}catch(e){}
const logs=Object.entries(c.logs||{}).map(([k,l])=>({k,...l})).concat((c.arch||[]).map((l,i)=>({k:"a"+i,...l}))).filter(l=>l&&l.d).sort((a,b)=>a.d<b.d?1:-1);
const tot=P?P.reduce((a,w)=>a+w.s.length,0):0,dn=Object.values(c.done||{}).filter(Boolean).length,last=logs[0]?logs[0].d:null,dl=dJours(last),ds=dJours(c.start);
let cw=0;if(P){cw=P.length-1;outer:for(let w=0;w<P.length;w++)for(let j=0;j<P[w].s.length;j++)if(!(c.done||{})[w+"-"+j]){cw=w;break outer}}
const al=[];const rec=logs.filter(l=>dJours(l.d)<=14);
if(rec.some(l=>l.pain==="oui"))al.push(["er","Douleur signalée"]);
if(logs.length>=2&&+logs[0].rpe>=9&&+logs[1].rpe>=9)al.push(["wa","2 séances à 9-10/10"]);
if(logs.slice(0,3).filter(l=>l.rec==="fatigue").length>=2)al.push(["wa","Fatigue répétée"]);
if(logs.length&&dl>=10)al.push(["wa","Inactif depuis "+dl+" j"]);
if(!logs.length&&ds>=7)al.push(["wa","Aucune séance depuis l’inscription"]);
if((p.sante||[]).length)al.push(["er","Point de santé signalé"]);
let tr=null;try{tr=m?trend(c.body,m.but):null}catch(e){}
return{c,p,P,m,logs,tot,dn,last,dl,cw,al,tr,ok:true}}
