function viewMe(){const{p,m,P}=ctx(),cm=f1;
A.innerHTML=`${bc("Mon profil")}<h2>Mon profil</h2><div class="card"><p style="margin:0"><b>${esc(user.email)}</b></p><p class="mu" style="margin:6px 0 0">${p.age} ans · ${p.taille} cm · ${cm(m.poids)} kg · ${NIV[p.niveau]} · ${p.seances} séances par semaine · ${OBJ[p.objectif]}</p><p class="mu" style="margin:6px 0 0">Méthode : ${esc(P.meta.nm)} · ${p.mat==="salle"?"en salle":p.mat==="corps"?"sans matériel":"à la maison"}</p></div>
<div class="card"><h3>Mon corps</h3><p class="mu" style="margin:0">IMC ${cm(m.imc)} · masse grasse ${m.known?"":"≈ "}${cm(m.mg)} % (${cm(m.fm)} kg) · masse maigre ${cm(m.lbm)} kg · muscle ≈ ${cm(m.smm)} kg · FFMI ${cm(m.nffmi)}</p><p class="mu" style="margin:6px 0 0">Nutrition : ${m.kcal} kcal · ${m.prot} g de protéines · ${m.carb} g de glucides · ${m.fat} g de lipides par jour</p></div>
<p class="mu">Ton profil et ta progression sont enregistrés en ligne dans ton compte : tu les retrouves sur n’importe quel appareil.</p>
<div class="row"><button id="pe">Modifier mon profil</button><button class="o" id="th">Thème ${data.theme==="l"?"sombre":"clair"}</button><button class="o" id="ex">Exporter mes données</button><button class="o" id="so">Se déconnecter</button></div>
<p style="margin-top:28px"><button class="o" id="de" style="color:var(--er);border-color:var(--er)">Effacer mon profil</button></p>`;
$("#pe").onclick=()=>{editing=true;step=0;render()};
$("#th").onclick=async()=>{data.theme=data.theme==="l"?"d":"l";await save();render()};
$("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="mes-donnees.json";a.click()};
$("#so").onclick=()=>signOut(auth);
$("#de").onclick=async()=>{if(confirm("Effacer ton profil et ta progression ? C’est définitif.")){data={p:null,done:{},tests:[],logs:{},checks:{},body:[],theme:data.theme};await save();tab="a";step=0;render()}}}

const EQV=[["2 œufs entiers",13,150],["Blanc de poulet cuit, 100 g",31,165],["Thon au naturel, 1 boîte égouttée",26,120],["Skyr nature, 200 g",22,120],["Yaourt grec 0 %, 170 g",17,100],["Fromage blanc 0 %, 200 g",15,90],["Saumon cuit, 120 g",26,250],["Bœuf haché 5 % cuit, 125 g",30,230],["Tofu ferme, 150 g",18,150],["Lentilles cuites, 200 g",18,230],["Pois chiches cuits, 150 g",13,245],["Whey, 30 g",24,120],["Flocons d’avoine, 60 g",8,230],["Lait demi-écrémé, 250 ml",8,115],["Pain complet, 2 tranches",7,170],["Amandes, 30 g",6,175]];
function viewNut(){const{p,m}=ctx(),cm=f1,tot=m.prot*4+m.carb*4+m.fat*9,pc=x=>R(x/tot*100);
const st=(l,v,u,c)=>`<div><div class="h"><span>${l}</span></div><b>${v}<small>${u}</small></b><span class="c">${c}</span></div>`;
const row=(t,k,pr,c,f)=>`<tr><td>${t}</td><td>${k}</td><td>${pr}</td><td>${c}</td><td>${f}</td></tr>`;
A.innerHTML=`${bc("Nutrition")}<h2>Nutrition</h2><p class="sub">Ce que tu dois manger chaque jour, calculé pour ton corps, ton activité et ton objectif.</p>
${m.al.map(a=>`<div class="warn">${esc(a)}</div>`).join("")}
<section class="hero2"><div class="ey">${m.but==="perdre"?"Perte de gras":m.but==="prendre"?"Prise de muscle":m.recomp?"Recomposition":"Maintien"}</div><h3>${m.kcal} kcal et ${m.prot} g de protéines par jour</h3><p class="sub">${esc(m.cap)}</p><p class="mu" style="margin:0">${esc(m.rateTxt)}</p></section>
<div class="st">${st("Protéines",m.prot,"g / jour",cm(R(m.prot/m.poids*10)/10)+" g par kg · de "+m.protLo+" à "+m.protHi+" g")}${st("Glucides",m.carb,"g / jour","Ton carburant pour l’effort")}${st("Lipides",m.fat,"g / jour","Hormones et santé, ne descends pas trop")}${st("Fibres",m.fib,"g / jour","Légumes, fruits, céréales complètes")}
${st("Eau",cm(m.eau),"L / jour","+ 0,5 L les jours d’entraînement")}${st("Métabolisme de base",m.bmr,"kcal","Ce que ton corps brûle au repos")}${st("Dépense estimée",m.tdee,"kcal / jour","Avec ton activité (× "+String(m.pal).replace(".",",")+")")}${st("Par repas",m.perMeal,"g de protéines","Sur 4 repas dans la journée")}</div>
<section class="card"><div class="ch2"><h3>Jour d’entraînement et jour de repos</h3></div><div class="tbl"><table><tr><th></th><th>kcal</th><th>Protéines</th><th>Glucides</th><th>Lipides</th></tr>${row("Jour d’entraînement",m.kcalT,m.prot+" g",m.cT+" g",m.fat+" g")}${row("Jour de repos",m.kcalR,m.prot+" g",m.cR+" g",m.fat+" g")}${row("<b>Moyenne</b>","<b>"+m.kcal+"</b>","<b>"+m.prot+" g</b>","<b>"+m.carb+" g</b>","<b>"+m.fat+" g</b>")}</table></div><p class="mu">Mange un peu plus de glucides les jours où tu t’entraînes, un peu moins les jours de repos. Sur la semaine, la moyenne reste à ${m.kcal} kcal.</p></section>
<section class="card"><div class="ch2"><h3>Répartition des calories</h3></div><div class="mb" role="img" aria-label="Protéines ${pc(m.prot*4)} %, glucides ${pc(m.carb*4)} %, lipides ${pc(m.fat*9)} %"><i style="width:${pc(m.prot*4)}%"></i><i style="width:${pc(m.carb*4)}%"></i><i style="width:${pc(m.fat*9)}%"></i></div><div class="lg"><span><i class="dot" style="background:var(--ac)"></i>Protéines <b>${pc(m.prot*4)} %</b></span><span><i class="dot" style="background:var(--ok)"></i>Glucides <b>${pc(m.carb*4)} %</b></span><span><i class="dot" style="background:var(--er)"></i>Lipides <b>${pc(m.fat*9)} %</b></span></div></section>
<section class="card"><div class="ch2"><h3>Ta composition corporelle</h3></div><div class="tbl"><table>
<tr><td>Masse grasse</td><td>${m.known?"":"≈ "}${cm(m.mg)} % · ${cm(m.fm)} kg</td></tr>
<tr><td>Masse maigre</td><td>${cm(m.lbm)} kg</td></tr>
<tr><td>Masse musculaire squelettique</td><td>≈ ${cm(m.smm)} kg</td></tr>
<tr><td>FFMI normalisé</td><td>${cm(m.nffmi)} · ${m.ffc}</td></tr>
<tr><td>IMC</td><td>${cm(m.imc)} · ${m.cat}</td></tr>
<tr><td>Poids santé (IMC 18,5 à 24,9)</td><td>${m.sain[0]} à ${m.sain[1]} kg</td></tr></table></div>
<p class="mu">Masse grasse : ${esc(m.src)}. Masse musculaire : ${esc(m.smmSrc)}. La masse maigre regroupe muscles, os, organes et eau. Le FFMI (masse maigre divisée par la taille au carré) compare ton muscle à celui des autres : entre 18 et 20 pour un homme en forme, 25 est proche de la limite naturelle (Kouri 1995).${m.pot!=null?` Ordre de grandeur : tu pourrais encore gagner jusqu’à ${cm(m.pot)} kg de masse maigre avant d’approcher cette limite, ce qui prend des années.`:""}</p>
<p class="mu">Ajoute tes mesures dans <b>Suivi</b> pour mettre ces chiffres à jour.</p></section>
<section class="card"><div class="ch2"><h3>Comment répartir tes protéines</h3></div><p>Répartis tes protéines sur 3 à 5 repas, avec environ ${m.perMeal} g par repas. Le total de la journée compte plus que l’horaire (Schoenfeld et Aragon 2018). Prends un repas riche en protéines dans les 2 heures qui entourent ta séance.</p><div class="tbl"><table><tr><th>Aliment</th><th>Protéines</th><th>kcal</th></tr>${EQV.map(([n,pr,k])=>`<tr><td>${n}</td><td>≈ ${pr} g</td><td>≈ ${k}</td></tr>`).join("")}</table></div><p class="mu">Valeurs approximatives, qui varient selon la marque et la cuisson.</p></section>
<section class="card"><div class="ch2"><h3>Compléments : ce qui a des preuves</h3></div>${m.minor?"<p>Avant 18 ans, évite les compléments sauf avis médical. Une alimentation variée suffit.</p>":`<details class="sc" open><summary>Créatine monohydrate</summary><p>3 à 5 g par jour, tous les jours, sans phase de charge nécessaire. C’est le complément le plus étudié pour la force et la masse musculaire (ISSN 2017). Demande un avis médical en cas de problème rénal.</p></details><details class="sc"><summary>Caféine</summary><p>3 à 6 mg par kg (soit ${R(m.poids*3)} à ${R(m.poids*6)} mg pour toi), 30 à 60 minutes avant l’effort, améliore la performance (ISSN 2021). Évite-la tard dans l’après-midi pour protéger ton sommeil.</p></details><details class="sc"><summary>Protéines en poudre</summary><p>Pratique pour atteindre ta cible, jamais obligatoire : 1 g de protéine en poudre vaut 1 g de protéine alimentaire.</p></details><details class="sc"><summary>Ce qui n’a pas de preuve solide</summary><p>BCAA si tu manges assez de protéines, brûleurs de graisse, boosters de testostérone. Économise ton argent.</p></details>`}</section>
<section class="card"><div class="ch2"><h3>Comment c’est calculé</h3></div><p class="mu" style="margin:0">Métabolisme de base ${m.bmr} kcal (${m.known?"moyenne de Mifflin-St Jeor et de Katch-McArdle, ce dernier utilise ta masse maigre":"formule de Mifflin-St Jeor"}) × niveau d’activité ${String(m.pal).replace(".",",")} = ${m.tdee} kcal de dépense. Ton objectif ajuste ce chiffre (${m.but==="perdre"?"déficit":m.but==="prendre"?"surplus":"maintien"}), sans descendre sous ton métabolisme de base ni sous ${p.sexe==="h"?1500:1200} kcal. Protéines : ${m.but==="perdre"?"2,5":m.but==="prendre"?"2,2":["hypertrophie","force"].includes(p.objectif)?"2,1":"1,9"} g par kg de masse maigre (Morton 2018, Helms 2014). Lipides : au moins 0,8 g par kg et 25 % des calories. Glucides : le reste.</p><p class="mu">Ce sont des repères : pèse-toi chaque semaine. Si ton poids ne bouge pas comme prévu après 2 à 3 semaines, ajuste de 100 à 150 kcal. Ce n’est pas un avis médical ou diététique. Ton médecin ou un diététicien peut t’aider si tu as une maladie, une grossesse ou un trouble alimentaire.</p></section>
<details class="sc"><summary>Sources</summary><ol class="src">${SRCS.slice(0,10).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>`}
