<body>
<header><h1>Gauthier’s<small>COACHING</small></h1><b id="av"></b></header>
<div id="shell"><aside id="sd"><div class="br">Gauthier’s<small>COACHING</small></div><p class="tg">Préparation physique<br>&amp; suivi personnel</p><nav id="nv"><button data-t="a"><svg viewBox="0 0 24 24" class="ic"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span class="l">Vue d’ensemble</span><span class="k2">Accueil</span></button><button data-t="c"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg><span class="l">Mon profil</span><span class="k2">Profil</span></button><button data-t="p"><svg viewBox="0 0 24 24" class="ic"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span class="l">Programme</span><span class="k2">Séances</span></button><button data-t="s"><svg viewBox="0 0 24 24" class="ic"><path d="M4 4v16h16M7 15l4-5 3 3 5-7"/></svg><span class="l">Suivi</span><span class="k2">Suivi</span></button><button data-t="e"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg><span class="l">Épreuves</span><span class="k2">Tests</span></button><button data-t="g"><svg viewBox="0 0 24 24" class="ic"><path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h10"/></svg><span class="l">Guide</span><span class="k2">Guide</span></button></nav><p class="qt">Un objectif.<br>Huit semaines pour avancer.</p><div class="us"><i id="av2"></i><span id="un"></span></div></aside><main id="app">Chargement… Si rien n’apparaît, vérifie ta connexion internet.</main></div>

<dialog id="dg"></dialog>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";
const fb=initializeApp({apiKey:"AIzaSyCpeBNqDropla1CKUzJWgS7kyB5qwH5BvA",authDomain:"gauthier-coaching.firebaseapp.com",projectId:"gauthier-coaching",storageBucket:"gauthier-coaching.firebasestorage.app",messagingSenderId:"383165911782",appId:"1:383165911782:web:2bba35f1ff9f1a1882a127"});
const auth=getAuth(fb),db=getFirestore(fb);
const $=s=>document.querySelector(s),A=$("#app"),R=Math.round;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mm=s=>Math.floor(s/60)+":"+String(R(s%60)).padStart(2,"0");
const tsec=t=>{const m=String(t||"").match(/^(\d{1,2})[:'](\d{2})$/);return m?+m[1]*60+ +m[2]:0};
const r5=x=>Math.max(10,R(x/5)*5);
let user=null,data={p:null,done:{},tests:[],logs:{},checks:{}},wk=0,editing=false;
function flash(t){const f=$("#fl");f.textContent=t;f.style.display="block";clearTimeout(flash.t);flash.t=setTimeout(()=>f.style.display="none",2500)}
async function save(){try{await setDoc(doc(db,"clients",user.uid),data);flash("Enregistré")}catch(e){flash("Échec de l’enregistrement ("+(e.code||"réseau")+")")}}
const ERR={"auth/invalid-credential":"E-mail ou mot de passe incorrect.","auth/email-already-in-use":"Un compte existe déjà avec cet e-mail.","auth/weak-password":"Mot de passe trop court (6 caractères minimum).","auth/invalid-email":"Adresse e-mail invalide.","auth/network-request-failed":"Pas de connexion internet."};

/* ---------- Calculs ---------- */
function calc(p){
const h=p.taille/100,imc=p.poids/h/h;let mg,src;
if(p.mg>0){mg=p.mg;src="valeur saisie par toi"}
else if(p.cou>0&&p.ta>p.cou&&(p.sexe==="h"||p.hanc>0)){
mg=p.sexe==="h"?495/(1.0324-.19077*Math.log10(p.ta-p.cou)+.15456*Math.log10(p.taille))-450:495/(1.29579-.35004*Math.log10(p.ta+p.hanc-p.cou)+.221*Math.log10(p.taille))-450;
src="estimée avec tes mensurations (méthode US Navy, précision ± 3 à 4 points)"}
else{mg=1.2*imc+.23*p.age-10.8*(p.sexe==="h"?1:0)-5.4;src="estimation grossière à partir de l’IMC et de l’âge"}
mg=Math.max(3,R(mg*10)/10);
const bmr=10*p.poids+6.25*p.taille-5*p.age+(p.sexe==="h"?5:-161),tdee=bmr*(1.3+.05*p.seances);
const hi=p.sexe==="h"?mg>=25:mg>=32,lo=imc<18.5;let f=1,cap="Maintien : ton poids doit rester stable.";
if(hi&&!lo){f=.85;cap="Léger déficit pour perdre du gras sans perdre de performance (viser 0,3 à 0,5 kg par semaine)."}
else if(p.objectif==="hypertrophie"&&!lo){f=1.08;cap="Léger surplus pour construire du muscle."}
else if(lo){cap="IMC bas : ne cherche pas à perdre de poids, mange suffisamment."}
const kcal=Math.max(R(f*tdee/50)*50,R(bmr/50)*50);
const cat=imc<18.5?"insuffisance pondérale":imc<25?"corpulence normale":imc<30?"surpoids":"obésité";
return{imc:R(imc*10)/10,cat,mg,src,kcal,prot:R(p.poids*1.8),cap,hi}}

/* ---------- Génération du programme ---------- */
const PH=["Prise de repères","Montée en charge","Montée en charge","Semaine allégée","Intensification","Intensification","Pic de charge","Affûtage et test blanc"];
const FOC=["On apprend les gestes et on évalue ta tolérance à l’effort. Reste à 6 sur 10 d’effort maximum.","On ajoute un peu de volume. Le corps s’adapte : ne cherche pas à aller plus vite.","Dernière semaine de montée progressive : un peu plus de volume, même rythme.","Le volume baisse d’environ 25 %. C’est pendant cette semaine que le corps assimile le travail.","Les séances rapides deviennent plus exigeantes. Respecte tes jours de repos.","On pousse un peu plus : séries plus longues, repos respectés.","Semaine la plus chargée du programme. Sommeil et alimentation comptent plus que jamais.","On réduit la fatigue pour arriver frais. Test blanc en fin de semaine."];
const SL={polyvalent:{2:"IF",3:"IFR",4:"IFRF",5:"IFRFL"},cardio:{2:"IF",3:"IRF",4:"IRFI",5:"IRFIR"},endurance:{2:"LF",3:"RLF",4:"RLFR",5:"RLFRI"},hypertrophie:{2:"HR",3:"HHR",4:"HHRH",5:"HHRHR"}};
const INT=[[8,"30 s","30 s de trot"],[10,"30 s","30 s de trot"],[6,"1 min","1 min de trot"],[6,"30 s","30 s de trot"],[5,"400 m","1 min 30 de trot"],[6,"400 m","1 min 30 de trot"],[4,"600 m","2 min de trot"],[3,"400 m","2 min de trot"]];
const WR=[[1,2,8],[2,2,7],[3,2,6],[3,2,4],[5,1,5],[8,1,3],[15,1,2],[10,1,2]];
const SP={2:[6,4],4:[8,6],5:[10,8],6:[12,10]};
const SCH=[[3,12],[3,12],[4,10],[3,10],[4,10],[4,8],[4,8],[3,10]];
const RIR=["garde 3 répétitions en réserve","garde 2 à 3 répétitions en réserve","garde 2 répétitions en réserve","charges réduites de 10 %, très propre","garde 1 à 2 répétitions en réserve","garde 1 à 2 répétitions en réserve","garde 1 répétition en réserve","garde 2 répétitions en réserve"];
const TYP=["Haut du corps (poussée)","Dos et biceps (tirage)","Jambes"];
const EX={salle:[["Développé couché","Développé incliné haltères","Développé militaire","Élévations latérales"],["Tirage vertical","Rowing barre ou haltère","Tirage horizontal","Curl haltères"],["Squat ou presse à cuisses","Fentes marchées","Soulevé de terre roumain","Mollets debout"]],maison:[["Pompes","Pompes pieds surélevés","Pike push-ups","Dips sur chaise"],["Rowing avec sac ou élastique","Tirage élastique","Superman au sol","Curl avec élastique ou sac"],["Squat goblet (sac chargé)","Fentes","Squat bulgare","Pont fessier"]]};
function gen(p){
const L=+p.niveau,n=p.seances,ok=p.run30==="oui",sc=[.7,1,1.2][L];
const pu=p.pompes||[8,18,32][L],su=p.situps||[25,45,65][L],d0=[20,30,40][L]+(p.t5>0&&p.t5<26?5:0);
const pk=p.t5>0?p.t5*12:0,easy=pk?" (allure environ "+mm(pk+60)+"/km, tu dois pouvoir parler)":" (tu dois pouvoir parler)";
const fast=pk?" à environ "+mm(pk-10)+"/km":", allure soutenue";
const slots=SL[p.objectif][n];
return PH.map((t,w)=>{let h=0,spd=0;
const sl=slots.split("");if(w===7)sl[sl.length-1]="T";
const s=sl.map(c=>{
const wu="Échauffement 10 min",cd="Retour au calme et étirements 5 min";let nm,d,it;
if("RIL".includes(c)&&!ok){const[a,b,k]=WR[w];
if(c==="L"){nm="Marche active ou vélo";d=r5(d0*1.4*[1,1.1,1.2,.8,1.25,1.35,1.45,.7][w])+" min";it=[`Marche rapide ou vélo à intensité modérée : ${d}`,"Tu dois pouvoir parler sans t’essouffler."]}
else{nm="Course et marche";d=(a+b)*k+15+" min";it=[wu,`${a} min de course lente + ${b} min de marche, ${k} répétitions`,cd]}}
else if(c==="R"){nm="Course facile";const m=r5(d0*[1,1.1,1.2,.75,1.25,1.35,1.45,.7][w]);d=m+" min";it=[wu,`Course continue : ${Math.min(60,m)} min`+easy,cd]}
else if(c==="L"){nm="Sortie longue";const m=Math.min(75,r5(d0*1.4*[1,1.1,1.2,.75,1.25,1.35,1.45,.7][w]));d=m+" min";it=[wu,`Course continue : ${m} min`+easy,"Bois régulièrement et ne force pas sur la fin."]}
else if(c==="I"){nm="Fractionné";const[r,a,b]=INT[w],k=Math.max(3,R(r*sc));d="45 min";it=["Échauffement 15 min",`${k} × (${a} rapide${fast}, ${b})`,"Retour au calme 10 min"]}
else if(c==="H"){const ty=(h+w)%3,q=SCH[w],st=Math.max(2,q[0]-(L===0?1:0));h++;nm="Musculation : "+TYP[ty];d="55 min";
it=[wu,...EX[p.mat][ty].map((e,j)=>`${e} : ${st} × ${q[1]+(j>1?2:0)}`),`Intensité : ${RIR[w]}`,"Gainage : 3 × 40 s","Si tu réussis toutes les répétitions, ajoute la plus petite charge possible à la séance suivante.",cd]}
else if(c==="F"){nm="Renforcement pour le test";d="45 min";
const q=[.5,.55,.6,.45,.65,.7,.75,.5][w],st=[3,3,4,3,4,4,4,3][w];
it=[wu,`Pompes : ${st} × ${Math.max(4,R(pu*q))}, repos 60 s`+(pu<8?" (sur les genoux ou mains surélevées)":""),`Sit-ups, coudes aux genoux : ${st} × ${Math.max(8,R(su*q*.6))}`,`Burpees : ${st} × ${Math.max(5,R([6,8,10,6,12,14,15,8][w]*sc))}`,`Planche : ${st} × ${[20,25,30,20,35,40,45,30][w]} s`];
if(w>0)it.push("Sauts en longueur sans élan : 4 × 4, repos complet entre les sauts");
it.push("Lancers de ballon de 3 kg (ou lancers poitrine contre un mur) : 3 × 8, explosifs");
if(ok&&SP[w]&&!spd++)it.push(`Sprint (une seule séance par semaine) : ${Math.max(4,R(SP[w][0]*[.7,.9,1][L]))} × 25 m puis ${Math.max(3,R(SP[w][1]*[.7,.9,1][L]))} × 50 m à vitesse maximale, retour en trottinant, 3 min de repos entre les deux séries. Fais quelques départs couché sur le dos (épreuve du 24 m).`);
it.push(cd)}
else{nm="Test blanc";d="50 min";it=["Échauffement 15 min","Pompes 2 min · Sit-ups 2 min · Saut en longueur (3 essais) · Course 24 m couché au départ · Lancer ballon 3 kg (3 essais) · Course 2400 m chronométrée","Note tes résultats dans l’onglet Suivi."]}
return{nm,d,it}});
return{t,f:FOC[w],s}})}

<div class="st">${st("Poids actuel",'<path d="M6 8h12l2 12H4zM9 8a3 3 0 016 0"/>',cm(p.poids),"kg","Dernière mesure enregistrée")}${st("IMC",'<circle cx="12" cy="5" r="2"/><path d="M12 8v6M7 10l5-2 5 2M9 21l3-7 3 7"/>',cm(m.imc),"kg/m²","Repère, pas un diagnostic")}${st("Masse grasse",'<path d="M5 19c0-9 5-14 14-14 0 9-5 14-14 14zM5 19l7-7"/>',(p.mg>0?"":"≈ ")+cm(m.mg),"%",p.mg>0?"Valeur saisie":"Estimation, pas une mesure")}${st("Séances réalisées",'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',dn,"/ "+tot,"Sur ton cycle de 8 semaines")}</div>
<div class="two"><section class="card"><div class="ch2"><h3>La semaine en cours</h3><span class="bd">Semaine ${cw+1}</span></div>${W.s.map((s,j)=>`<div class="rw" data-j="${j}"><div class="ti">${IC('<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>')}</div><div><span class="mu">Séance ${j+1}${data.done[cw+"-"+j]?" · faite":""}</span><b>${esc(s.nm)}</b><span class="mu">${s.d}</span></div></div>`).join("")}</section>
<section class="card"><div class="ch2"><h3>Le mot du coach</h3></div><p>${ck?esc(ck.msg):"La régularité passe avant la performance d’un jour. Garde de la marge, note tes sensations et ajuste avec ton coach."}</p><p class="mu">Repères quotidiens : ${m.kcal} kcal et ${m.prot} g de protéines. ${m.cap}</p><button class="o" id="ck">Faire mon bilan du jour</button></section></div>`;
$("#go").onclick=()=>{tab="p";wk=cw;render();scrollTo(0,0)};
A.querySelectorAll("[data-j]").forEach(r=>r.onclick=()=>{tab="p";wk=cw;render();scrollTo(0,0)});
$("#ck").onclick=openCheck}

function viewProg(){const{P}=ctx(),W=P[wk];
A.innerHTML=`${bc("Programme")}<h2>Programme</h2><div class="wk">${P.map((w,i)=>`<button data-w="${i}" class="${i===wk?"on":""} ${w.s.every((_,j)=>data.done[i+"-"+j])?"dn":""}">Semaine ${i+1}</button>`).join("")}</div><h3>${W.t}</h3><p class="mu">${W.f}</p>
${W.s.map((s,j)=>{const k=wk+"-"+j,d=data.done[k];return`<article class="card s"><div class="sh"><div><b>${esc(s.nm)}</b><span class="mu">${s.d}</span></div>${d?"<em>Fait</em>":""}</div><ul>${s.it.map(x=>{const g=gfind(x);return`<li><span>${esc(x)}</span>${g>=0?`<button class="q" data-g="${g}" aria-label="Comment faire cet exercice ?">?</button>`:""}</li>`}).join("")}</ul><button class="${d?"o":""}" data-l="${k}">${d?"Modifier mon bilan":"Terminer la séance"}</button></article>`}).join("")}`;
A.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{wk=+b.dataset.w;render()});
A.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const[,t,st,er,ez,hd]=G[b.dataset.g];modal(`<h3>${t}</h3><ol>${st.split("|").map(x=>`<li>${x}</li>`).join("")}</ol><p><b>Erreurs fréquentes</b><br>${er}</p><p><b>Trop dur ?</b> ${ez}<br><b>Trop facile ?</b> ${hd}</p><p class="mu">Douleur vive, vertige ou malaise : arrête l’exercice.</p>`)});
A.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>openLog(b.dataset.l))}

function openLog(k){const{P}=ctx(),[w,j]=k.split("-"),s=P[w].s[j],o=data.logs[k]||{};
const op=(a,v)=>'<option value="">Choisir…</option>'+a.map(([x,t])=>`<option value="${x}"${o[v]===x?" selected":""}>${t}</option>`).join("");
modal(`<h3>${esc(s.nm)}</h3><form id="fg"><label class="f">Difficulté ressentie<select name="rpe" required>${op([["2","2 – Très facile"],["4","4 – Facile"],["6","6 – Modérée"],["7","7 – Soutenue, contrôlée"],["8","8 – Difficile"],["9","9 – Très difficile"],["10","10 – Maximale"]],"rpe")}</select></label>
<label class="f">Séance réalisée comme prévu ?<select name="ok" required>${op([["oui","Oui, y compris la version allégée"],["non","Non, interrompue ou partielle"]],"ok")}</select></label>
<label class="f">Douleur inhabituelle pendant ou après ?<select name="pain" required>${op([["non","Non"],["oui","Oui : arrêter et faire le point"]],"pain")}</select></label>
<label class="f">Sensations après la séance<select name="rec" required>${op([["bonne","Bonnes, gêne légère ou absente"],["tot","Trop tôt pour savoir"],["fatigue","Fatigue ou courbatures importantes"]],"rec")}</select></label>
<label class="f">Notes, charges, répétitions (facultatif)<textarea name="notes" rows="2">${esc(o.notes)}</textarea></label><div class="row"><button type="submit">Enregistrer</button></div></form>`);
$("#fg").onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));data.logs[k]={...v,d:today(),n:s.nm};data.done[k]=v.ok==="oui";await save();render();
if(v.pain==="oui")modal("<h3>Douleur signalée</h3><p>Ne refais pas l’exercice qui la provoque. Si elle persiste ou s’aggrave, demande un avis médical avant de reprendre.</p>");else dg.close()}}

function openCheck(){modal(`<h3>Bilan du jour</h3><form id="fk"><label class="f">Sommeil de la dernière nuit (heures)<input name="so" type="number" step="0.5" min="0" max="14" required></label><label class="f">Fatigue générale (0 = aucune, 10 = épuisement)<input name="fa" type="number" min="0" max="10" required></label>
<label class="f">Douleur inhabituelle, malaise ou symptôme nouveau ?<select name="dl" required><option value="">Choisir…</option><option value="n">Non</option><option value="o">Oui ou je ne suis pas sûr</option></select></label>
<label class="f">Fièvre ou maladie aiguë aujourd’hui ?<select name="fv" required><option value="">Choisir…</option><option value="n">Non</option><option value="o">Oui</option></select></label><div class="row"><button type="submit">Adapter ma séance</button></div></form>`);
$("#fk").onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));
const msg=v.dl==="o"||v.fv==="o"?"Reporte la séance d’aujourd’hui. Si la douleur ou les symptômes persistent, demande un avis médical avant de reprendre.":+v.so<6||+v.fa>=7?"Fais la séance en version allégée : environ 30 % de séries ou de durée en moins, allure plus lente, 6 sur 10 d’effort maximum.":"Feu vert : fais ta séance comme prévu.";
data.checks[today()]={msg};await save();render();modal(`<h3>Ton bilan</h3><p>${msg}</p><p class="mu">Ce bilan aide à maintenir, alléger ou reporter. Ce n’est pas une validation médicale.</p>`)}}

function chart(t,pts,fm,fd,nd,wide){
if(pts.length<2)return`<div class="ct${wide?" w":""}"><h4>${t}</h4><p class="mu" style="margin:8px 0 4px">${nd?"Termine une deuxième séance pour voir ta courbe.":(pts.length?`Départ : ${fm(pts[0][1])}. `:"")+"Ajoute un résultat pour voir ta courbe."}</p></div>`;
const W=wide?640:300,H=92,pd=8,v=pts.map(x=>x[1]),mn=Math.min(...v),mx=Math.max(...v),sp=mx-mn||1,X=i=>pd+i*(W-2*pd)/(pts.length-1),Y=y=>H-pd-(y-mn)/sp*(H-2*pd);
const d=pts.map((x,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(x[1]).toFixed(1)}`).join(""),dl=v[v.length-1]-v[0],up=nd?"":dl*(nd===0?1:fd.inv?-1:1)>=0?"up":"dw";
return`<div class="ct${wide?" w":""}"><h4>${t}</h4><p class="dl ${up}">${fm(v[v.length-1])}${nd?"":`<small>${fd(dl)} depuis le départ</small>`}</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t}"><path d="${d}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x[1]).toFixed(1)}" r="3.5" fill="var(--p)" stroke="var(--ac)" stroke-width="2"/>`).join("")}</svg><div class="ax"><span>${pts[0][0]}</span><span>${pts[pts.length-1][0]}</span></div></div>`}
function charts(){const{p,P}=ctx(),T=data.tests,sg=v=>(v>0?"+":"−")+Math.abs(R(v)),tm=v=>(v>0?"+":"−")+mm(Math.abs(v));tm.inv=1;
const ser=(k,tk)=>{const o=p[k]>0?[["Départ",p[k]]]:[];T.forEach(t=>{const x=parseFloat(String(t[tk]).replace(",","."));if(x>0)o.push([t.d.slice(0,5),x])});return o};
const t24=(p.t2400&&tsec(p.t2400)?[["Départ",tsec(p.t2400)]]:[]).concat(T.filter(t=>tsec(t.f)).map(t=>[t.d.slice(0,5),tsec(t.f)]));
const lg=Object.values(data.logs).filter(l=>+l.rpe>0).sort((a,b)=>a.d.localeCompare(b.d)).map(l=>[l.d.slice(8)+"/"+l.d.slice(5,7),+l.rpe]);
const W=640,H=92,bw=40,gp=(W-8*bw)/9,bars=P.map((w,i)=>{const n=w.s.length,d=w.s.filter((_,j)=>data.done[i+"-"+j]).length,x=gp+i*(bw+gp),h=H-22;return`<rect x="${x}" y="${H-18-h}" width="${bw}" height="${h}" rx="4" fill="var(--ln)"/><rect x="${x}" y="${H-18-h*d/n}" width="${bw}" height="${h*d/n}" rx="4" fill="var(--ac)"/><text x="${x+bw/2}" y="${H-3}" text-anchor="middle" font-size="12" fill="var(--mu)">${i+1}</text>`}).join("");
return chart("Pompes en 2 min",ser("pompes","a"),R,sg)+chart("Sit-ups en 2 min",ser("situps","b"),R,sg)+chart("Course 2400 m",t24,mm,tm)+chart("Saut en longueur (cm)",ser("saut","c"),R,sg)
+`<div class="ct w"><h4>Séances faites par semaine</h4><p class="dl">${Object.values(data.done).filter(Boolean).length}<small>sur ${P.reduce((a,w)=>a+w.s.length,0)} prévues</small></p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Séances faites par semaine">${bars}</svg></div>`
+chart("Effort ressenti par séance (sur 10)",lg,R,sg,1,1)}
function viewTrack(){const L=Object.entries(data.logs).sort((a,b)=>b[1].d.localeCompare(a[1].d));
A.innerHTML=`${bc("Suivi")}<h2>Suivi</h2><p class="sub">Ta progression, épreuve après épreuve.</p><div class="cg">${charts()}</div>
<h3 style="margin-top:28px">Séances terminées</h3>${L.length?`<div class="card" style="overflow-x:auto"><table><tr><th>Date</th><th>Séance</th><th>Effort</th><th>Douleur</th></tr>${L.map(([,l])=>`<tr><td>${esc(l.d)}</td><td>${esc(l.n)}</td><td>${esc(l.rpe)}/10</td><td>${l.pain==="oui"?"oui":"non"}</td></tr>`).join("")}</table></div>`:'<p class="mu">Rien pour l’instant. Termine une séance dans Programme pour la retrouver ici.</p>'}`}

function viewEp(){
A.innerHTML=`${bc("Épreuves")}<h2>Épreuves</h2><p class="sub">Le test militaire de l’Armée luxembourgeoise comporte 6 épreuves. Il faut les passer toutes, obtenir au moins 1 point sur 20 à chacune (8 sur 20 au 2400 m) et une moyenne de 10 sur 20.</p>
<div class="card"><ol style="margin:0;padding-left:20px"><li>Lancer de ballon de 3 kg</li><li>Sit-ups en 2 minutes</li><li>Saut en longueur sans élan</li><li>Course de 24 m, départ couché sur le dos</li><li>Pompes en 2 minutes</li><li>Course de 2400 m</li></ol></div>
<h3 style="margin-top:28px">Mes résultats</h3><p class="mu">Passe tes 6 épreuves toutes les 2 à 4 semaines et note-les ici : les courbes apparaissent dans Suivi.</p>
<form id="ft" class="card"><div class="g">${fld("Pompes en 2 min","a","")}${fld("Sit-ups en 2 min","b","")}${fld("Saut en longueur (cm)","c","")}${fld("Course 24 m (s)","d","")}${fld("Lancer ballon 3 kg (m)","e","")}${fld("Course 2400 m","f","",{t:"text",h:"min:sec"})}</div><div class="row"><button type="submit">Ajouter ce test</button></div></form>
${data.tests.length?`<div class="card" style="overflow-x:auto"><table><tr><th>Date</th><th>Pompes</th><th>Sit-ups</th><th>Saut</th><th>24 m</th><th>Ballon</th><th>2400 m</th></tr>${data.tests.map(t=>`<tr><td>${esc(t.d)}</td><td>${esc(t.a)}</td><td>${esc(t.b)}</td><td>${esc(t.c)}</td><td>${esc(t.dd)}</td><td>${esc(t.e)}</td><td>${esc(t.f)}</td></tr>`).join("")}</table></div>`:""}`;
$("#ft").onsubmit=async ev=>{ev.preventDefault();const f=ev.target;if(f.f.value&&!tsec(f.f.value)){flash("2400 m : écris le temps comme 11:30");return}
data.tests.push({d:new Date().toLocaleDateString("fr-BE"),a:f.a.value,b:f.b.value,c:f.c.value,dd:f.d.value,e:f.e.value,f:f.f.value});await save();render()}}

function viewGu(){A.innerHTML=`${bc("Guide")}<h2>Guide des exercices</h2><p class="sub">Ouvre un exercice pour voir la technique, les erreurs à éviter et les variantes.</p>${G.map(([,t,st,er,ez,hd])=>`<details class="card gd"><summary>${t}</summary><ol>${st.split("|").map(x=>`<li>${x}</li>`).join("")}</ol><p><b>Erreurs fréquentes</b><br>${er}</p><p><b>Trop dur ?</b> ${ez}<br><b>Trop facile ?</b> ${hd}</p></details>`).join("")}<p class="mu">Douleur vive, vertige ou malaise : arrête l’exercice.</p>`}

function viewMe(){const p=data.p;
A.innerHTML=`${bc("Mon profil")}<h2>Mon profil</h2><div class="card"><p style="margin:0"><b>${esc(user.email)}</b></p><p class="mu" style="margin:6px 0 0">${p.age} ans · ${p.taille} cm · ${p.poids} kg · ${NIV[p.niveau]} · ${p.seances} séances par semaine · ${OBJ[p.objectif]}</p></div>
<p class="mu">Ton profil et ta progression sont enregistrés en ligne dans ton compte : tu les retrouves sur n’importe quel appareil.</p>
<div class="row"><button id="pe">Modifier mon profil</button><button class="o" id="th">Thème ${data.theme==="l"?"sombre":"clair"}</button><button class="o" id="ex">Exporter mes données</button><button class="o" id="so">Se déconnecter</button></div>
<p style="margin-top:28px"><button class="o" id="de" style="color:var(--er);border-color:var(--er)">Effacer mon profil</button></p>`;
$("#pe").onclick=()=>{editing=true;step=0;render()};
$("#th").onclick=async()=>{data.theme=data.theme==="l"?"d":"l";await save();render()};
$("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="mes-donnees.json";a.click()};
$("#so").onclick=()=>signOut(auth);
$("#de").onclick=async()=>{if(confirm("Effacer ton profil et ta progression ? C’est définitif.")){data={p:null,done:{},tests:[],logs:{},checks:{},theme:data.theme};await save();tab="a";step=0;render()}}}

function render(){const sh=$("#shell"),em=user?(user.email||"?"):"";document.documentElement.dataset.t=data.theme||"d";$("#av").textContent=em[0]?em[0].toUpperCase():"";
if(!user){sh.classList.add("bare");return viewAuth()}
if(!data.p||editing){sh.classList.add("bare");return viewForm()}
sh.classList.remove("bare");$("#av2").textContent=(data.p.prenom||em)[0].toUpperCase();$("#un").textContent=data.p.prenom||em.split("@")[0];
$("#nv").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));({a:viewHome,c:viewMe,p:viewProg,s:viewTrack,e:viewEp,g:viewGu})[tab]()}
$("#nv").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.t;render();scrollTo(0,0)}};
onAuthStateChanged(auth,async u=>{user=u;editing=false;wk=0;data={p:null,done:{},tests:[],logs:{},checks:{}};
if(u){try{const s=await getDoc(doc(db,"clients",u.uid));if(s.exists())data={...data,...s.data()}}catch(e){A.innerHTML='<div class="warn">Impossible de charger ton profil. Vérifie ta connexion puis recharge la page.</div>';return}}
render()});
</script>
</body>
</html>
