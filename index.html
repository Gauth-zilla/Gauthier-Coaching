[/^Prévention du genou/,"Prévention du genou (bloc de 4 minutes)","À faire après l’échauffement, avant les exercices lourds de jambes.|Squat lent : descends en 3 secondes, genoux dans l’axe des pieds, remonte en 1 seconde.|Petits sauts : saute à peine, reçois-toi sur l’avant-pied puis tout le pied, en pliant hanches et genoux, sans bruit.|Marche latérale avec élastique : élastique au-dessus des genoux, pas de côté, genoux qui ne rentrent pas.|Step-down : debout sur une marche, descends l’autre pied vers le sol en 3 secondes sans que le genou rentre ni que le bassin bascule.|Fente arrière lente : recule d’un pas, descends en contrôle, genou avant au-dessus du pied.","Genoux qui rentrent vers l’intérieur à la descente ou à la réception. Réception bruyante, jambes raides. Aller vite pour finir plus tôt.","Fais le squat lent sans saut et la marche latérale sans élastique, en te regardant de face dans un miroir.","Ajoute une pause de 2 secondes en bas, ou une réception sur une seule jambe quand tout est parfaitement contrôlé."],
[/^Cercles de hanches à quatre pattes/,"Cercles de hanches à quatre pattes","Mets-toi à quatre pattes, mains sous les épaules, genoux sous les hanches.|Lève un genou et ouvre-le sur le côté.|Dessine un grand cercle lent avec le genou : devant, sur le côté, derrière.|Garde le dos plat et le bassin immobile : seule la hanche bouge. Change de sens, puis de jambe.","Bouger tout le bassin, creuser le dos, aller trop vite.","Fais des cercles plus petits et appuie-toi sur les avant-bras.","Ajoute un élastique autour des cuisses, ou garde 1 seconde au point le plus haut."],
[/^90\/90/,"90/90 : rotations de hanche","Assis au sol, une jambe devant avec le genou plié à angle droit, l’autre jambe sur le côté, aussi à angle droit.|Redresse le dos et pose les mains au sol si besoin.|Penche-toi vers le tibia de devant sans arrondir le dos, 5 secondes.|Fais pivoter les deux genoux de l’autre côté, comme un essuie-glace, puis recommence.","Dos arrondi, fesses qui se décollent du sol, forcer une position douloureuse.","Pose les mains au sol derrière toi et assieds-toi sur un coussin.","Fais le changement de côté sans les mains, en gardant le dos droit."],
[/^Fente basse avec rotation du buste/,"Fente basse avec rotation du buste","Fais un grand pas en avant, genou arrière près du sol, pose les deux mains à l’intérieur du pied avant.|Passe la main du côté de la jambe avant derrière la tête.|Tourne le buste vers la jambe avant en pointant le coude vers le plafond, et suis le coude du regard.|Reviens et recommence, puis change de jambe.","Genou avant qui rentre, buste qui s’affaisse, pied arrière qui se déplace.","Garde le genou arrière au sol, sur un coussin.","Lève le genou arrière et tiens la fente 2 secondes à chaque rotation."],
[/^Mobilité de cheville genou au mur/,"Mobilité de cheville : genou au mur","Place un pied à environ 10 cm d’un mur, l’autre jambe en arrière.|Plie le genou vers le mur en gardant le talon collé au sol.|Touche le mur avec le genou, puis reviens.|Si c’est facile, recule le pied de 1 à 2 cm et recommence.","Talon qui se décolle, genou qui rentre vers l’intérieur, pied qui tourne vers l’extérieur.","Rapproche le pied du mur ou tiens-toi à un appui.","Recule progressivement le pied jusqu’à 12 cm sans décoller le talon."],
[/^Cercles d’épaules et mobilité thoracique/,"Mobilité thoracique à quatre pattes","À quatre pattes, une main derrière la tête, l’autre bras tendu au sol.|Tourne le coude vers le sol, vers le bras d’appui.|Ouvre ensuite le coude vers le plafond en suivant du regard.|Garde le bassin immobile. Change de côté.","Tourner avec le bas du dos plutôt qu’avec le haut du dos, bouger le bassin.","Fais le mouvement plus petit et plus lentement.","Fais une pause de 2 secondes ouvert, en expirant."],
[/^Rotation externe à l’élastique, coude collé/,"Rotation externe à l’élastique, coude collé","Élastique fixé à hauteur du coude, debout de profil.|Coude collé au flanc et plié à 90°, avant-bras devant le ventre.|Tourne l’avant-bras vers l’extérieur, lentement, sans décoller le coude.|Reviens en 3 secondes.","Coude qui s’éloigne du corps, épaule qui monte, élastique trop tendu.","Utilise un élastique plus léger ou une simple bouteille d’eau, allongé sur le côté.","Garde la fin du mouvement 2 secondes ou passe à un élastique plus résistant."],
[/^Respiration 5 min/,"Respiration lente (5 minutes)","Assis ou allongé, une main sur le ventre.|Inspire par le nez en 4 secondes en gonflant le ventre puis les côtes.|Expire par la bouche en 6 secondes, lèvres presque fermées.|Répète pendant 5 minutes, sans forcer.","Respirer avec les épaules, retenir son souffle, forcer l’expiration.","Inspire 3 secondes, expire 4 secondes.","Inspire 4 secondes, expire 8 secondes."],
[/^Étirements \d+ min/,"Étirements après la séance","Fais-les une fois bien chaud, après la séance.|Tiens chaque position 20 à 30 secondes, sans rebondir.|Respire calmement, l’étirement doit rester supportable, jamais douloureux.|Passe sur les muscles travaillés : fléchisseurs de hanche, mollets, ischios, pectoraux, dos.","Rebondir, retenir son souffle, étirer jusqu’à la douleur.","Réduis l’amplitude et tiens 15 secondes.","Tiens 45 secondes ou fais deux passages."],
[/^Technique de la semaine/,"Techniques d’intensité","Tempo 3-1-1 : 3 secondes pour descendre, 1 seconde de pause en bas, 1 seconde pour monter.|AMRAP : maximum de répétitions propres sur la dernière série, en gardant 1 répétition en réserve.|Superset : deux exercices enchaînés sans repos entre eux.|Drop set : près de l’échec, baisse la charge de 20 % et continue.|Repos-pause : une courte série, 15 secondes de repos, une mini-série, et ainsi de suite.","Utiliser une technique sur tous les exercices : la fatigue explose. Une seule par séance suffit.","Saute la technique et fais tes séries normalement.","Applique la technique à un exercice de plus."],
[/^Intensité : garde/,"Répétitions en réserve (RIR)","« 2 répétitions en réserve » veut dire que tu t’arrêtes quand tu pourrais encore en faire 2 propres.|Plus la semaine avance, plus la réserve diminue : tu t’approches de ton maximum sans l’atteindre.|Si tu es incertain, garde 1 répétition de plus en réserve.","Aller à l’échec à chaque série : la fatigue s’accumule et la technique se dégrade.","Garde plus de marge.","Réduis la réserve d’une répétition sur la dernière série."],
[/Échauffement 10 min, puis/,"Séries d’approche","Avant le premier exercice lourd, fais 2 séries légères : 50 % puis 75 % de la charge de travail.|Fais 5 à 8 répétitions lentes pour préparer les articulations.|Pas besoin de séries d’approche sur les exercices suivants si tu es déjà chaud.","Sauter l’approche et attaquer à froid.","Ajoute une série à 30 %.","Ajoute une série à 90 % (1 répétition) sur les exercices très lourds."],
[/Training Max|5\/3\/1|Boring But Big|First Set Last/,"Le principe du 5/3/1","Training Max : 90 % de ton maximum estimé. Toutes les charges en découlent.|Semaine 1 : 3 séries de 5, la dernière avec le maximum de répétitions (« + »). Semaine 2 : 3 répétitions. Semaine 3 : 5, 3 puis 1. Semaine 4 : semaine légère.|Au 2e cycle, le Training Max monte de 2,5 kg (haut du corps) ou 5 kg (bas du corps).|Le travail supplémentaire (5 × 10 à 50 %, puis 5 × 5) construit le muscle.","Partir d’un maximum trop optimiste. Mieux vaut partir trop léger.","Baisse le Training Max de 5 à 10 %.","Si tu dépasses largement les répétitions prévues, augmente le Training Max au cycle suivant."],
[/allure seuil/,"Course au seuil (tempo)","Le seuil est l’allure « confortablement difficile » : tu tiens environ 1 heure en course.|Cours les blocs à cette allure régulière, sans accélérer.|Trot lent entre les blocs, sans t’arrêter.|Tu peux dire quelques mots, mais pas une phrase complète.","Partir trop vite sur le premier bloc.","Raccourcis les blocs ou ralentis un peu.","Allonge un bloc de 2 minutes."],
[/^Fartlek/,"Fartlek","Fartlek veut dire « jeu de vitesse » en suédois.|Alterne à ton gré des accélérations de 30 secondes à 2 minutes et des relances en trot.|Utilise des repères du parcours : arbres, poteaux, bancs.","Sprinter à chaque accélération : l’allure doit rester soutenue, pas maximale.","Réduis le nombre d’accélérations.","Raccourcis les temps de récupération."],
[/en côte/,"Répétitions en côte","Choisis une côte régulière de 5 à 8 %.|Monte en foulée courte, buste droit, bras actifs.|Redescends en marchant : la récupération fait partie de l’exercice.","Se pencher en avant et courir sur la pointe des pieds.","Pente plus douce, effort plus court.","Une répétition de plus ou 5 s d’effort en plus."],
[/^Pyramide/,"Pyramide","Les efforts montent en durée puis redescendent.|La récupération est la moitié du temps d’effort.|Garde la même vitesse sur tous les efforts.","Partir trop vite sur les premiers efforts.","Ralentis légèrement.","Ajoute un effort au sommet."],
[/norvégienne|85-95 %/,"Intervalles longs 4 × 4","4 minutes à 85-95 % de ta fréquence cardiaque max : tu respires fort mais tu contrôles.|3 minutes de trot lent entre les efforts, pour baisser le cœur.|Aucun sprint : le dernier effort doit ressembler au premier.","Partir trop fort : le dernier intervalle devient impossible.","Passe à 3 minutes d’effort.","Ajoute un cinquième effort (une seule fois)."],
[/20 s d’effort maximal/,"HIIT 20/10","20 secondes d’effort maximal, puis 10 secondes de repos (ou 40 s si tu débutes).|8 répétitions forment un bloc de 4 minutes (protocole inspiré de Tabata, 1996).|Choisis un mouvement sûr : vélo, rameur, course sur place. Évite les sauts si tes genoux fatiguent.","Faire toutes les séries à 80 % au lieu de les faire à fond.","Rallonge le repos (40 s).","Ajoute un bloc."],
[/Course progressive/,"Course progressive","Commence tranquillement, ajoute de la vitesse tous les 10 minutes environ.|La fin est soutenue mais jamais un sprint.|Termine en gardant de la marge.","Accélérer trop tôt.","Reste à allure modérée sur la dernière partie.","Fais la dernière partie plus vite."],
[/lignes droites/,"Lignes droites (strides)","Accélère progressivement sur 20 secondes jusqu’à 90 % de ta vitesse max.|Reste relâché : épaules basses, mains ouvertes.|Marche 1 minute pour récupérer complètement.","Crisper les épaules en accélérant.","Fais-en 4 au lieu de 6.","Passe à 8."],
[/^Circuit :|^EMOM|^AMRAP|^Échelle/,"Formats de circuit","Circuit : tu enchaînes les exercices, repos court entre eux, repos plus long entre les tours.|EMOM : chaque minute, tu fais le nombre indiqué puis tu récupères jusqu’à la minute suivante.|AMRAP : autant de tours que possible dans le temps donné.|Échelle : 1 répétition de chaque exercice, puis 2, puis 3… puis tu redescends.","Choisir une charge ou une allure trop élevée dès le premier tour.","Réduis les répétitions.","Ajoute 2 répétitions ou une charge."],
[/Format circuit/,"Superset en circuit","Enchaîne deux exercices sans repos : c’est une paire (superset).|Repose-toi 45 secondes après chaque paire.|Les exercices de la paire sollicitent souvent des muscles différents pour que tu récupères entre les deux.","Sacrifier la technique pour aller vite.","Ajoute 15 s de repos.","Réduis le repos à 30 s."],
[/^Marche lestée/,"Marche lestée (rucking)","Sac à dos chargé de 5 à 10 % de ton poids, bien serré dans le dos.|Marche rapide, pas longs, épaules relâchées.|Terrain varié si possible : montées et descentes.","Charger trop et se blesser le dos.","Réduis la charge de 2 kg.","Ajoute 2 kg ou 5 minutes."],
[/zone 2/,"Cardio en zone 2","La zone 2, c’est l’endurance de base : tu peux parler en phrases complètes.|Garde un effort régulier, ne cherche pas la vitesse.|Cette séance prépare le cœur sans fatiguer ton corps pour le reste de la semaine.","Aller trop vite et en faire une séance difficile.","Ralentis, ou fais 10 minutes de moins.","Allonge de 5 minutes."],
[/Salutation au soleil|Guerrier/,"Yoga doux","Enchaîne les postures lentement, en synchronisant avec la respiration.|Reste dans une zone sans douleur.|Si tu manques de souplesse, plie les genoux.","Forcer pour atteindre la posture parfaite.","Reste moins longtemps.","Allonge chaque posture de 15 secondes."],
[/Mobilité 10 min/,"Mobilité","Fais chaque mouvement lentement, sans rebond.|Respire calmement.|Cherche l’amplitude sans douleur.","Aller trop vite.","Réduis l’amplitude.","Ajoute une série."],
[/Auto-massage/,"Auto-massage","Roule lentement sur le muscle avec un rouleau ou une balle.|Reste quelques secondes sur les points sensibles.|Évite les articulations et le bas du dos.","Appuyer trop fort jusqu’à avoir très mal.","Appuie moins.","Reste plus longtemps sur les zones tendues."],
[/Équilibre sur une jambe/,"Équilibre sur une jambe","Debout sur une jambe, genou souple, bassin stable.|D’abord yeux ouverts, puis yeux fermés.|Garde un point fixe devant toi.","Bloquer le genou.","Appuie-toi légèrement à un mur.","Surface instable ou bras croisés."],
[/Finisher/,"Finishers","Courte séquence de fin de séance pour le cardio ou le gainage.|Intensité modérée à soutenue, mais la technique d’abord.","En faire trop après une séance déjà dure.","Réduis la durée de moitié.","Ajoute un tour."],
[/départ arrêté|lancés/,"Vitesse et départs","Échauffement complet avec accélérations progressives.|Départ arrêté : pousse fort dans le sol, buste incliné, foulées courtes puis qui s’allongent.|Lancés : accélère puis garde la vitesse sans te crisper.|Récupère complètement entre les efforts.","Sprinter sans échauffement complet.","Raccourcis les distances.","Ajoute une répétition."],
[/2400 m chronométrée/,"Test blanc","Échauffe-toi 15 min, puis passe les épreuves dans l’ordre de l’Armée si possible.|Repose-toi 2 à 3 min entre les épreuves.|Sur le 2400 m, pars à une allure tenable : 6 tours de piste à vitesse régulière.|Note chaque résultat dans l’onglet Suivi.","Partir trop vite sur le 2400 m et s’écrouler au 3e tour.","Fais 3 épreuves aujourd’hui et le reste demain.","Chronomètre chaque tour de piste pour rester régulier."],
[/× \(/,"Fractionné","Après l’échauffement, cours la durée ou la distance indiquée à allure soutenue mais contrôlée (7 à 8 sur 10).|Récupère en trottinant ou en marchant, sans t’arrêter complètement.|Garde la même vitesse sur toutes les répétitions.","Faire la première répétition à fond puis ralentir.","Ralentis l’allure ou allonge la récupération.","Raccourcis la récupération de 10 à 15 secondes."],
[/course continue|sortie longue|marche rapide|vélo/,"Course à allure facile","Cours à une vitesse où tu peux parler en phrases complètes.|Garde un pas régulier, épaules relâchées, regard devant.|Respire sans forcer.","Courir trop vite : première cause d’abandon et de blessure.","Alterne course et marche (4 min / 1 min).","Allonge de 5 minutes à la fois."],
[/course lente/,"Course et marche","Cours très lentement la durée indiquée, plus lentement que ce que tu penses.|Marche ensuite pour récupérer, sans t’arrêter.|Répète le nombre de fois demandé.","Courir trop vite dès la première minute.","Marche plus longtemps entre deux courses.","Passe à la suite quand tu finis sans être essoufflé."],
[/échauffement/,"Échauffement","Marche ou trottine 5 min en augmentant doucement le rythme.|Fais des cercles d’épaules et de hanches, puis des fentes dynamiques.|Termine par 2 accélérations progressives de 10 secondes.","Sauter l’échauffement quand on manque de temps.","Réduis à 6 minutes, ne le supprime pas.","Ajoute 2 séries légères de l’exercice du jour."],
[/pompe|push-up/,"Pompes","Mains un peu plus larges que les épaules, corps aligné de la tête aux talons.|Descends en gardant les coudes à environ 45° jusqu’à frôler le sol.|Remonte en tendant les bras sans cambrer le dos.|Au test, garde un rythme régulier pendant 2 minutes.","Bassin qui tombe, amplitude trop courte, coudes écartés à 90°.","Mains surélevées (banc, table) ou sur les genoux.","Pieds surélevés ou pause d’1 seconde en bas."],
[/sit-up/,"Sit-ups","Sur le dos, jambes fléchies, pieds bloqués, mains croisées sur la poitrine.|Monte jusqu’à toucher les genoux avec les coudes.|Redescends jusqu’aux omoplates au sol, sans élan.","Tirer sur la nuque, monter avec élan.","Réduis l’amplitude.","Mains derrière les tempes, rythme plus soutenu."],
[/burpee/,"Burpees","Debout, accroupis-toi et pose les mains au sol.|Lance les pieds en arrière en position de pompe.|Ramène les pieds sous toi et saute bras tendus.","Dos creusé en position de pompe, réception raide.","Retire le saut ou avance plus lentement.","Ajoute une pompe à chaque répétition."],
[/planche|gainage/,"Planche","Avant-bras au sol, coudes sous les épaules, corps droit.|Serre abdos et fessiers, regarde le sol.|Respire normalement.","Dos creusé, fesses en l’air, respiration bloquée.","Appuie-toi sur les genoux.","Lève un bras ou une jambe en alternance."],
[/sprint/,"Sprint et départ couché","Après un échauffement complet, place-toi sur le dos pour les départs couchés.|Au signal, relève-toi vite et accélère à vitesse maximale.|Reviens en trottinant : la récupération compte autant que l’effort.","Sprinter sans échauffement : risque de claquage.","Réduis les répétitions de moitié.","Ne rajoute rien : une séance de sprint par semaine suffit."],
[/saut/,"Saut en longueur sans élan","Pieds largeur d’épaules, genoux fléchis, bras en arrière.|Balance les bras vers l’avant et saute le plus loin possible.|Réceptionne pieds joints, genoux souples.","Réception sur les talons, buste trop penché.","Sauts plus courts avec plus de repos.","Fléchis plus bas avant la poussée."],
[/ballon|lancer/,"Lancer de ballon","Assis, dos droit, ballon tenu à deux mains au-dessus de la poitrine.|Pousse et lance le plus loin possible, vers 45°.|Récupère entre chaque lancer.","Lancer avec les bras seulement, sans le tronc.","Utilise un ballon plus léger.","Ajoute une impulsion du buste vers l’avant."],
[/développé|dips/,"Développés et dips","Épaules basses et serrées, pieds bien posés.|Descends en contrôle, remonte sans verrouiller les coudes.|Choisis une charge qui te laisse la marge indiquée.","Charge trop lourde, rebond sur la poitrine.","Allège la charge.","Ralentis la descente (3 secondes)."],
[/élévations/,"Élévations latérales","Haltères légers, coudes légèrement fléchis.|Monte les bras sur les côtés à hauteur d’épaules.|Redescends lentement.","Balancer le corps pour monter la charge.","Allège la charge.","Pause d’1 seconde en haut."],
[/tirage|rowing|superman/,"Tirages et rowing","Poitrine ouverte, épaules basses, dos plat.|Tire en ramenant les coudes vers l’arrière, serre les omoplates.|Reviens lentement bras tendus.","Hausser les épaules, balancer le buste.","Charge ou élastique plus léger.","Pause d’1 seconde en contraction."],
[/curl/,"Curl biceps","Coudes collés au corps, épaules relâchées.|Monte l’haltère jusqu’aux épaules sans balancer.|Redescends en 2 à 3 secondes.","Se pencher en arrière pour monter la charge.","Allège la charge.","Ralentis la descente."],
[/squat|presse|bulgare/,"Squat et presse","Pieds largeur d’épaules, pointes légèrement ouvertes.|Descends en poussant le bassin vers l’arrière, genoux dans l’axe des pieds.|Remonte en poussant dans les talons.","Genoux qui rentrent, dos qui s’arrondit.","Squat sur banc ou amplitude réduite.","Pause de 2 secondes en bas."],
[/fentes/,"Fentes","Grand pas en avant, buste droit.|Descends jusqu’à ce que le genou arrière frôle le sol.|Pousse dans le talon avant pour revenir.","Genou avant qui rentre vers l’intérieur.","Fentes statiques, mains sur les hanches.","Ajoute des haltères."],
[/soulevé|pont fessier|mollets/,"Soulevé roumain, pont fessier, mollets","Soulevé : dos plat, genoux légèrement fléchis, bassin vers l’arrière.|Pont : serre les fessiers en haut.|Mollets : monte lentement sur la pointe des pieds.","Dos arrondi sur le soulevé.","Charge légère, amplitude réduite.","Fais l’exercice sur une jambe."]];

const SCI=[["Combien de séries par muscle ?","Au moins 10 séries par muscle et par semaine donnent plus de muscle que moins de 5 (Schoenfeld 2017). Tes programmes visent 10 à 20 séries par muscle."],["Combien de fois par semaine ?","Travailler chaque muscle 2 fois par semaine est plus efficace qu’une seule fois (Schoenfeld 2016). C’est pourquoi le full body et le haut / bas sont proposés en premier."],["Pourquoi deux blocs de 4 semaines ?","Un programme qui varie (périodisation) donne de meilleurs gains de force qu’un programme identique pendant des semaines (Williams 2017). Les exercices changent tous les 2 semaines, la charge monte pendant 3 semaines, puis une semaine allégée laisse le corps assimiler."],["Pourquoi de la musculation pour les coureurs ?","Le renforcement réduit les blessures de sport d’environ un tiers (Lauersen 2014) et améliore l’économie de course."],["Pourquoi si peu de séances dures en course ?","Les coureurs d’élite font environ 80 % de leur entraînement très facile et 20 % très dur (Seiler 2010). Courir trop vite tous les jours fatigue sans faire progresser."],["Femmes : pourquoi plus de bas du corps ?","Les femmes gagnent du muscle de façon comparable aux hommes en proportion, mais elles en ont moins au départ, surtout en haut du corps. Les programmes pour femmes de cette appli mettent donc environ deux tiers du volume sur les fessiers, les cuisses et les ischios, et gardent le dos et les épaules pour la posture. Les pectoraux et les bras sont limités. C’est une répartition choisie pour le physique recherché, pas une obligation médicale : coche d’autres muscles prioritaires dans ton profil si tu veux autre chose."],
["Les charges lourdes rendent-elles « costaud » ?","Aucune étude ne montre que les femmes doivent soulever plus léger. Ce qui fait grossir un muscle, c’est surtout le nombre de séries, les calories en surplus et les années d’entraînement : les gains sont lents. Tes charges montent progressivement et restent proches de ton niveau. Pour rester tonique sans prendre de volume, garde tes calories stables (objectif Maintenir) et suis les répétitions indiquées."],
["Charges et répétitions chez les femmes","Une femme fait souvent plus de répétitions qu’un homme avec le même pourcentage de sa charge maximale. Les fourchettes sont donc un peu plus hautes (10 à 12 répétitions sur les exercices de base, 12 à 15 en isolation). Les charges de départ partent de ton poids avec des coefficients plus bas pour le haut du corps que pour les jambes et les fessiers, car l’écart de force entre hommes et femmes est plus grand en haut du corps. Ce sont des estimations : ajuste-les avec les séries réelles."],
["Cycle menstruel et entraînement","Les revues disponibles ne montrent pas d’effet fiable de la phase du cycle sur la force ni sur le gain de muscle (Colenso-Semple 2023). Tu n’as pas besoin d’adapter ton programme à ta phase. Si un jour tu te sens vidée, baisse la charge ce jour-là. Si tes règles disparaissent ou deviennent irrégulières sans raison connue (grossesse exclue), parles-en à un médecin : c’est un signe possible de manque d’énergie."],
["Protéger les genoux","L’entraînement neuromusculaire (renforcement, petits sauts amortis, équilibre, retour d’information sur la position des genoux) réduit le risque de rupture du ligament croisé chez les sportives (méta-régression, British Journal of Sports Medicine 2016). Tes séances de bas du corps commencent donc par 4 minutes d’exercices de contrôle du genou."],
["Énergie disponible : le seuil à ne pas franchir","L’énergie disponible, c’est ce que tu manges moins ce que tu dépenses à l’entraînement, rapporté à ta masse maigre. Autour de 45 kcal par kg de masse maigre et par jour, c’est confortable. Sous 30, les hormones, les os et la récupération en souffrent, chez les femmes comme chez les hommes (IOC 2023). L’appli ne te propose jamais un apport sous ce seuil."],
["Les intervalles 4 × 4 minutes","Des efforts de 4 minutes à 90-95 % de la fréquence cardiaque max améliorent la VO2max plus que de l’entraînement modéré (Helgerud 2007)."]];
SRCS.push("Pelland JC, Remmert JF, Robinson ZP, Hinson SR, Zourdos MC (2026). The resistance training dose response: meta-regressions exploring the effects of weekly volume and frequency on muscle hypertrophy and strength gains. Sports Medicine, 56(2):481-505 (résumé lu dans une synthèse).",
"Baz-Valle E et al. (2019). The effects of exercise variation in muscle thickness, maximal strength and motivation in resistance trained men. PLoS ONE.",
"Helms ER, Cronin J, Storey A, Zourdos MC (2016). Application of the repetitions in reserve-based rating of perceived exertion scale for resistance training. Strength and Conditioning Journal, 38(4):42-49.",
"Zourdos MC et al. (2016). Novel resistance training-specific rating of perceived exertion scale measuring repetitions in reserve. Journal of Strength and Conditioning Research, 30(1):267-275.",
"Schumann M et al. (2022). Compatibility of concurrent aerobic and strength training for skeletal muscle size and function: an updated systematic review and meta-analysis. Sports Medicine (résultats lus dans le préprint de la méta-analyse).",
"Effect of strength training programs in middle- and long-distance runners’ economy at different running speeds: a systematic review with meta-analysis (2024). Sports Medicine, PMC11052887.",
"Paluch AE et al. (2022). Daily steps and all-cause mortality: a meta-analysis of 15 international cohorts. Lancet Public Health.",
"Thomas DT, Erdman KA, Burke LM (2016). Position of the Academy of Nutrition and Dietetics, Dietitians of Canada, and the American College of Sports Medicine: nutrition and athletic performance (glucides avant et après l’effort).",
"Tanaka H, Monahan KD, Seals DR (2001). Age-predicted maximal heart rate revisited. Journal of the American College of Cardiology (équation 208 − 0,7 × âge).",
"Daniels J (2013). Daniels’ Running Formula, 3e éd. Human Kinetics (équations du VDOT, coût en oxygène et fraction de la VO2max selon la durée).",
"Epley B (1985). Poundage chart. Boyd Epley Workout, Université du Nebraska (formule d’estimation du maximum à partir d’une série).",
"Recommended Routine, communauté r/bodyweightfitness (échelles de progression au poids du corps : 3 × 5 jusqu’à 3 × 8, puis échelon suivant).",
"Stronger By Science. Long muscle lengths and hypertrophy (synthèse de vulgarisation, preuves limitées).");
SCI.push(["Séries directes et indirectes","Un développé couché travaille surtout les pectoraux, mais aussi un peu les triceps et l’avant des épaules. La méta-analyse la plus récente sur le volume (Pelland 2026, 67 études) trouve que compter ces séries indirectes pour moitié prédit le mieux les résultats. Elle montre aussi que les gains continuent de monter avec le volume, mais de moins en moins vite : 6 à 8 séries bien faites donnent déjà une bonne partie du résultat."],
["Pourquoi les exercices changent toutes les 2 semaines","Changer d’exercice à chaque séance ne fait pas gagner plus de muscle ni de force, même si c’est plus motivant (Baz-Valle 2019). Garder un exercice 2 semaines permet de battre ta performance d’une semaine à l’autre, puis le changer apporte de la nouveauté et travaille le muscle sous un autre angle."],
["Régler l’effort : les répétitions en réserve","Une série à « 2 répétitions en réserve » s’arrête 2 répétitions avant l’échec. Cette échelle sert à régler la difficulté d’une série sans aller à l’échec (Zourdos 2016, Helms 2016). L’estimation est plus fine quand la série est proche de l’échec. Au début, tu auras tendance à sous-estimer l’effort : une séance sans douleur et avec une réserve de 2 à 3 répétitions suffit pour progresser."],
["Comment l’appli règle tes charges","Quand tu notes une série avec « Noter », l’appli estime ton maximum (formule d’Epley), ajoute environ 1 % par semaine d’écart, puis calcule la charge qui te laisse la marge prévue cette semaine-là. Le rythme de 1 % par semaine est une hypothèse de l’appli, pas une loi : si tes séries te paraissent trop faciles ou trop dures, note-les, la charge suivante se corrige seule."],
["Course et musculation dans la même semaine","Faire les deux ne gêne pas le gain de muscle ni la force maximale. Seule la force explosive (sauts, sprints) progresse un peu moins, surtout quand les deux types de séance sont dans la même séance (Schumann 2022). Sépare-les d’au moins 3 heures quand tu peux, et mets la séance qui compte le plus en premier."],
["La musculation aide-t-elle à courir ?","Oui. Les séances de force avec des charges lourdes (80 % du maximum ou plus) améliorent un peu l’économie de course, surtout aux allures rapides, d’après une méta-analyse de 2024 (31 études, 652 coureurs). Les sauts légers aident un peu aux allures lentes. L’effet est petit : la musculation complète la course, elle ne la remplace pas."],
["Travailler le muscle en position étirée","Les exercices qui chargent le muscle quand il est étiré (fente profonde, soulevé de terre roumain, extension des triceps au-dessus de la tête, mollets en amplitude complète) donnent peut-être un peu plus de muscle. Les preuves sont minces et l’effet modeste : cela ne justifie pas de changer ton programme, seulement de garder toute l’amplitude."],
["Marcher : combien de pas ?","Le risque de décès baisse jusqu’à environ 8 000 à 10 000 pas par jour avant 60 ans, et jusqu’à 6 000 à 8 000 après 60 ans. Au-delà, le gain est faible (Paluch 2022). Chaque tranche de 1 000 pas en plus compte, même si tu pars de 3 000."],
["Manger autour de la séance","Pour une séance de musculation de moins d’une heure, un repas normal 2 à 3 heures avant suffit. Les repères de 1 à 4 g de glucides par kg, 1 à 4 heures avant, et de 1 à 1,2 g par kg et par heure pendant 4 heures après, concernent surtout les efforts longs ou deux séances rapprochées (ACSM, 2016)."]);

<div class="card"><h3>Mes données</h3><p class="mu" style="margin:0">Ton profil et ta progression sont enregistrés en ligne dans ton compte : tu les retrouves sur n’importe quel appareil.</p><div class="row"><button class="o" id="ex">Exporter mes données</button><button class="o" id="so">Se déconnecter</button><button class="o dg" id="de">Effacer mon profil</button></div><p class="mu" style="margin:14px 0 0;font-size:.88rem">« Effacer mon profil » remet ton programme à zéro et garde ton compte. Pour tout supprimer définitivement, y compris ton compte :</p><div class="row"><button class="o dg" id="dac">Supprimer mon compte</button></div></div>
<p class="mu" style="text-align:center;margin-top:24px">Gauthier’s coaching · Version 12 · 14 nov. 2026</p>`;

const EQV=[["2 œufs entiers",13,150],["Blanc de poulet cuit, 100 g",31,165],["Thon au naturel, 1 boîte égouttée",26,120],["Skyr nature, 200 g",22,120],["Yaourt grec 0 %, 170 g",17,100],["Fromage blanc 0 %, 200 g",15,90],["Saumon cuit, 120 g",26,250],["Bœuf haché 5 % cuit, 125 g",30,230],["Tofu ferme, 150 g",18,150],["Lentilles cuites, 200 g",18,230],["Pois chiches cuits, 150 g",13,245],["Whey, 30 g",24,120],["Flocons d’avoine, 60 g",8,230],["Lait demi-écrémé, 250 ml",8,115],["Pain complet, 2 tranches",7,170],["Amandes, 30 g",6,175]];
function viewNut(){const{p,m}=ctx(),cm=f1,tot=m.prot*4+m.carb*4+m.fat*9,pc=x=>R(x/tot*100);
const st=(l,v,u,c)=>`<div><div class="h"><span>${l}</span></div><b>${v}<small>${u}</small></b><span class="c">${c}</span></div>`;
const row=(t,k,pr,c,f)=>`<tr><td>${t}</td><td>${k}</td><td>${pr}</td><td>${c}</td><td>${f}</td></tr>`;
A.innerHTML=`${bc("Nutrition")}<h2>Nutrition</h2><p class="sub">Ce que tu dois manger chaque jour, calculé pour ton corps, ton activité et ton objectif.</p>
${m.al.map(a=>`<div class="warn">${esc(a)}</div>`).join("")}
<section class="hero2 nh"><div class="ey">${m.but==="perdre"?"Perte de gras":m.but==="prendre"?"Prise de muscle":m.recomp?"Recomposition":"Maintien"}</div>
<div class="nz">${donutSVG([[m.prot*4,"var(--mp)"],[m.carb*4,"var(--mc)"],[m.fat*9,"var(--mf)"]],m.kcal,"kcal / jour")}<div class="mac">
<div><i style="background:var(--mp)"></i><span>Protéines<small>${cm(R(m.prot/m.poids*10)/10)} g par kg de poids</small></span><b>${m.prot} g</b><em>${pc(m.prot*4)} %</em></div>
<div><i style="background:var(--mc)"></i><span>Glucides<small>Ton carburant pour l’effort</small></span><b>${m.carb} g</b><em>${pc(m.carb*4)} %</em></div>
<div><i style="background:var(--mf)"></i><span>Lipides<small>Hormones et santé</small></span><b>${m.fat} g</b><em>${pc(m.fat*9)} %</em></div></div></div>
<p class="sub" style="margin-top:20px">${esc(m.cap)}</p><p class="mu" style="margin:0">${esc(m.rateTxt)}</p></section>
<div class="st">${st("Fibres",m.fib,"g / jour","Légumes, fruits, céréales complètes")}${st("Protéines",m.protLo+"–"+m.protHi,"g / jour","Fourchette conseillée, vise "+m.prot+" g")}
${st("Eau",cm(m.eau),"L / jour","+ 0,5 L les jours d’entraînement")}${st("Métabolisme de base",m.bmr,"kcal","Ce que ton corps brûle au repos")}${st("Dépense estimée",m.tdee,"kcal / jour","Avec ton activité (× "+String(m.pal).replace(".",",")+")")}${st("Par repas",m.perMeal,"g de protéines","Sur 4 repas dans la journée")}${st("Jour d’entraînement",m.kcalT,"kcal","Un peu plus de glucides")}${st("Jour de repos",m.kcalR,"kcal","Un peu moins de glucides")}</div>
${trendCard()}
<section class="card"><div class="ch2"><h3>Jour d’entraînement et jour de repos</h3></div><div class="tbl"><table><tr><th></th><th>kcal</th><th>Protéines</th><th>Glucides</th><th>Lipides</th></tr>${row("Jour d’entraînement",m.kcalT,m.prot+" g",m.cT+" g",m.fat+" g")}${row("Jour de repos",m.kcalR,m.prot+" g",m.cR+" g",m.fat+" g")}${row("<b>Moyenne</b>","<b>"+m.kcal+"</b>","<b>"+m.prot+" g</b>","<b>"+m.carb+" g</b>","<b>"+m.fat+" g</b>")}</table></div><p class="mu">Mange un peu plus de glucides les jours où tu t’entraînes, un peu moins les jours de repos. Sur la semaine, la moyenne reste à ${m.kcal} kcal.</p></section>
<section class="card"><div class="ch2"><h3>Ta composition corporelle</h3></div><div class="tbl"><table>
<tr><td>Masse grasse</td><td>${m.known?"":"≈ "}${cm(m.mg)} % · ${cm(m.fm)} kg</td></tr>
<tr><td>Masse maigre</td><td>${cm(m.lbm)} kg</td></tr>
<tr><td>Masse musculaire squelettique</td><td>≈ ${cm(m.smm)} kg</td></tr>
<tr><td>FFMI normalisé</td><td>${cm(m.nffmi)} · ${m.ffc}</td></tr>
<tr><td>IMC</td><td>${cm(m.imc)} · ${m.cat}</td></tr>
<tr><td>Poids santé (IMC 18,5 à 24,9)</td><td>${m.sain[0]} à ${m.sain[1]} kg</td></tr></table></div>
<p class="mu">Masse grasse : ${esc(m.src)}. Masse musculaire : ${esc(m.smmSrc)}. La masse maigre regroupe muscles, os, organes et eau. Le FFMI (masse maigre divisée par la taille au carré) compare ton muscle à celui des autres : entre 18 et 20 pour un homme en forme, 25 est proche de la limite naturelle (Kouri 1995).${m.pot!=null?` Ordre de grandeur : tu pourrais encore gagner jusqu’à ${cm(m.pot)} kg de masse maigre avant d’approcher cette limite, ce qui prend des années.`:""}</p>
<p class="mu">Ajoute tes mesures dans <b>Suivi</b> pour mettre ces chiffres à jour.</p></section>
<section class="card"><div class="ch2"><h3>Comment répartir tes protéines</h3></div><p>Répartis tes protéines sur 3 à 5 repas, avec environ ${m.perMeal} g par repas. Le total de la journée compte plus que l’horaire (Schoenfeld et Aragon 2018). Prends un repas riche en protéines dans les 2 heures qui entourent ta séance.</p><div class="tbl"><table><tr><th>Aliment</th><th>Protéines</th><th>kcal</th></tr>${EQV.map(([n,pr,k])=>`<tr><td>${n}</td><td>≈ ${pr} g</td><td>≈ ${k}</td></tr>`).join("")}</table></div><p class="mu">Valeurs approximatives, qui varient selon la marque et la cuisson.</p></section>
<section class="card"><div class="ch2"><h3>Une journée type</h3></div><div class="tbl"><table><tr><th>Repas</th><th>kcal</th><th>Protéines</th></tr>${[["Petit-déjeuner",.25],["Déjeuner",.3],["Collation ou repas avant la séance",.15],["Dîner",.3]].map(([n,f])=>`<tr><td>${n}</td><td>≈ ${R(m.kcal*f/10)*10}</td><td>≈ ${m.perMeal} g</td></tr>`).join("")}</table></div><p class="mu">Exemple à adapter à tes horaires. Les protéines restent régulières à chaque repas, les calories suivent ta faim et ton emploi du temps.</p></section>
<section class="card"><div class="ch2"><h3>Autour de la séance</h3></div><p><b>Avant.</b> Pour une séance de musculation, un repas normal 2 à 3 heures avant suffit. Avant un effort long ou intense, vise 1 à 4 g de glucides par kg, 1 à 4 heures avant : ${R(m.poids/5)*5} à ${R(m.poids*4/5)*5} g pour toi (ACSM 2016).</p><p><b>Après.</b> Si tu t’entraînes de nouveau dans moins de 8 heures, mange 1 à 1,2 g de glucides par kg et par heure pendant 4 heures (${R(m.poids/5)*5} à ${R(m.poids*1.2/5)*5} g par heure), avec des protéines. Sinon, ton repas suivant suffit.</p></section>
<section class="card"><div class="ch2"><h3>Pas, sommeil et récupération</h3></div><details class="sc" open><summary>Pas</summary><p>Vise ${p.age<60?"8 000 à 10 000":"6 000 à 8 000"} pas par jour : le risque de décès baisse jusqu’à ce seuil, puis le gain devient faible (Paluch 2022).${m.but==="perdre"?" En perte de gras, les pas dépensent des calories sans fatiguer comme une séance : monter de 2 000 pas est plus simple que de couper 100 kcal de plus.":""}</p></details><details class="sc"><summary>Sommeil</summary><p>${p.age<18?"Entre 8 et 10 heures par nuit à ton âge.":"Au moins 7 heures par nuit."} Dormir moins freine la récupération et la performance. Une bonne nuit compte autant que la séance du lendemain.</p></details></section>
<section class="card"><div class="ch2"><h3>Énergie disponible</h3></div><p>Avec ${m.kcal} kcal par jour et environ ${m.exD} kcal dépensées par jour à l’entraînement, ton énergie disponible est d’environ <b>${m.ea} kcal par kg de masse maigre</b>.</p><p class="mu" style="margin:0">${m.ea>=45?"C’est confortable : au-dessus de 45, tu couvres bien tes besoins.":m.ea>=30?(m.but==="perdre"?"C’est correct pour une phase de perte de gras, mais proche de la limite. Surveille ton énergie, ton sommeil et ta récupération.":"C’est suffisant pour couvrir tes besoins."):"C’est trop bas. Sous 30, les hormones, les os et la récupération en souffrent (IOC 2023). Mange davantage ou réduis le volume de tes séances."} Repères : 45 kcal par kg ou plus pour être à l’aise, moins de 30 à éviter (IOC 2023, Aspetar).</p></section>
${p.sexe==="f"?`<section class="card"><div class="ch2"><h3>Spécificités pour les femmes</h3></div><details class="sc" open><summary>Fer</summary><p>Les apports de référence européens sont de 16 mg par jour avant la ménopause, contre 11 mg pour un homme (EFSA 2015), à cause des pertes de règles. Viande rouge, boudin, lentilles, pois chiches et épinards en sont de bonnes sources. Associe-les à un aliment riche en vitamine C et évite le thé et le café pendant le repas. Si tu es souvent essoufflée ou épuisée, demande un bilan sanguin (ferritine) à ton médecin.</p></details><details class="sc"><summary>Vitamine D</summary><p>Les apports adéquats sont de 15 µg par jour (EFSA 2016). En hiver, le soleil de nos régions ne suffit souvent pas : parles-en à ton médecin ou à ton pharmacien avant de prendre un complément.</p></details><details class="sc"><summary>Os et cycle</summary><p>La musculation avec charges, la marche rapide et les petits sauts amortis aident tes os. Manger trop peu est le principal risque : règles qui s’arrêtent ou deviennent irrégulières, fractures de fatigue, fatigue durable. Dans ce cas, mange plus et consulte. Tu n’as pas besoin d’adapter l’entraînement à ta phase du cycle (Colenso-Semple 2023).</p></details><details class="sc"><summary>Protéines et lipides</summary><p>Tes protéines sont calculées sur ta masse maigre, comme pour un homme : le besoin ne change pas avec le sexe. Vise environ ${m.fat} g de lipides par jour : ils participent à la production des hormones.</p></details></section>`:""}
<section class="card"><div class="ch2"><h3>Compléments : ce qui a des preuves</h3></div>${m.minor?"<p>Avant 18 ans, évite les compléments sauf avis médical. Une alimentation variée suffit.</p>":`<details class="sc" open><summary>Créatine monohydrate</summary><p>3 à 5 g par jour, tous les jours, sans phase de charge nécessaire. C’est le complément le plus étudié pour la force et la masse musculaire (ISSN 2017). Demande un avis médical en cas de problème rénal.</p></details><details class="sc"><summary>Caféine</summary><p>3 à 6 mg par kg (soit ${R(m.poids*3)} à ${R(m.poids*6)} mg pour toi), 30 à 60 minutes avant l’effort, améliore la performance (ISSN 2021). Évite-la tard dans l’après-midi pour protéger ton sommeil.</p></details><details class="sc"><summary>Protéines en poudre</summary><p>Pratique pour atteindre ta cible, jamais obligatoire : 1 g de protéine en poudre vaut 1 g de protéine alimentaire.</p></details><details class="sc"><summary>Ce qui n’a pas de preuve solide</summary><p>BCAA si tu manges assez de protéines, brûleurs de graisse, boosters de testostérone. Économise ton argent.</p></details>`}</section>
<section class="card"><div class="ch2"><h3>Comment c’est calculé</h3></div><p class="mu" style="margin:0">Métabolisme de base ${m.bmr} kcal (${m.known?"moyenne de Mifflin-St Jeor et de Katch-McArdle, ce dernier utilise ta masse maigre":"formule de Mifflin-St Jeor"}) × niveau d’activité ${String(m.pal).replace(".",",")} = ${m.tdee} kcal de dépense. Ton objectif ajuste ce chiffre (${m.but==="perdre"?"déficit":m.but==="prendre"?"surplus":"maintien"}), sans descendre sous ton métabolisme de base, ni sous ${p.sexe==="h"?1500:1200} kcal, ni sous 30 kcal par kg de masse maigre une fois l’entraînement retiré. Protéines : ${m.but==="perdre"?"2,5":m.but==="prendre"?"2,2":["hypertrophie","force"].includes(p.objectif)?"2,1":"1,9"} g par kg de masse maigre (Morton 2018, Helms 2014). Lipides : au moins 0,8 g par kg et 25 % des calories. Glucides : le reste.</p><p class="mu">Ce sont des repères : pèse-toi chaque semaine. Si ton poids ne bouge pas comme prévu après 2 à 3 semaines, ajuste de 100 à 150 kcal. Ce n’est pas un avis médical ou diététique. Ton médecin ou un diététicien peut t’aider si tu as une maladie, une grossesse ou un trouble alimentaire.</p></section>
<details class="sc"><summary>Sources</summary><ol class="src">${SRCS.slice(0,10).concat(SRCS.filter(x=>/EFSA|IOC|Aspetar|Colenso|Thomas DT|Paluch/.test(x))).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>`}

sh.classList.remove("bare");document.body.classList.remove("bare");$("#av2").textContent=(data.p.prenom||em)[0].toUpperCase();$("#un").textContent=data.p.prenom||em.split("@")[0];
$("#nv").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));({a:viewHome,c:viewMe,p:viewProg,s:viewTrack,e:viewEp,g:viewGu,n:viewNut})[tab]();afterRender()}

try{matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{if(!(data.theme==="l"||data.theme==="d"))render()})}catch(e){}
onAuthStateChanged(auth,async u=>{user=u;editing=false;wk=0;data={p:null,done:{},tests:[],logs:{},checks:{},body:[],lifts:{}};
if(u){try{const s=await getDoc(doc(db,"clients",u.uid));if(s.exists())data={...data,...s.data()};try{initBadges()}catch(e){}if(data.p){try{const G0=gen(data.p,data.tests,data.lifts),nx=nextS(G0);wk=nx?nx[0]:G0.length-1}catch(e){}}}catch(e){A.innerHTML='<div class="warn">Impossible de charger ton profil. Vérifie ta connexion puis recharge la page.</div>';return}}
render()});
